<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        :root {
            --bg-color: #15202b;
            --text-color: #f5f8fa;
            --card-bg: #192734;
            --card-hover: #22303c;
            --border-color: #38444d;
            --accent-color: #ffffff;
            --muted-color: #8899a6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
        }

        .container {
            max-width: 440px;
            width: 100%;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 2rem;
            color: var(--muted-color);
            letter-spacing: -0.01em;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            display: flex;
            flex-direction: column;
            padding: 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-card:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .app-name {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .app-desc {
            font-size: 0.9rem;
            color: var(--muted-color);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Instead, check out the following site,</h1>
        
        <div class="app-list">
            <!-- App Card Start -->
            <a href="https://expern.in" class="app-card" target="_blank">
                <div class="app-name">Expern</div>
                <div class="app-desc">https://expern.in</div>
            </a>
            <!-- App Card End -->
        </div>
    </div>

</body>
</html>
